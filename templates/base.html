<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaven Run Club</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            font-size: 18px;
            padding-bottom: 40px;
        }

        .navbar-dark {
            background-color: #1b5e20 !important;
        }

        table {
            font-size: 16px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-3">
    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='logo.png') }}"
                 alt="Logo"
                 style="height:40px; margin-right:10px;">
            Leaven Run Club
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('index') }}">Today</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('checking') }}">Check‑In</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('runners') }}">Runners</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('rewards') }}">Rewards</a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<div class="container-fluid">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
