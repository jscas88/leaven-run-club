<!DOCTYPE html>
<html>
<head>
    <title>Leaven Run Club</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<nav>
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Leaven Logo" class="logo-img">

    <a href="{{ url_for('index') }}">Today</a>
    <a href="{{ url_for('runners') }}">Runners</a>
    <a href="{{ url_for('rewards') }}">Rewards</a>
</nav>


    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- ⭐ FLOATING ADMIN LOCK ICON ⭐ -->
<a href="{{ url_for('logout') if session.get('admin') else url_for('admin') }}"
   id="adminLockButton"
   title="{{ 'Lock Admin Mode' if session.get('admin') else 'Admin Login' }}">
    
    {% if session.get('admin') %}
        🔓
    {% else %}
        🔒
    {% endif %}
</a>

<style>
#adminLockButton {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #222;
    color: white;
    font-size: 28px;
    padding: 12px 16px;
    border-radius: 50%;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: 0.2s ease;
    z-index: 99999;
}

#adminLockButton:hover {
    background: #444;
    transform: scale(1.1);
}
</style>

</body>
</html>
