<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaven Run Club</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
        body {
            padding-top: 80px; /* Prevent content from hiding behind navbar */
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body class="bg-light">

    <!-- FIXED TOP NAVBAR -->
    <nav class="navbar navbar-light bg-light fixed-top shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center">

        <!-- Logo -->
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='logo.png') }}" 
                 style="height:40px; margin-right:10px;">
            Leaven Run Club
        </a>

        <!-- Always-visible menu -->
        <div class="d-flex gap-3">

            <a class="nav-link" href="{{ url_for('index') }}">🏠</a>
            <a class="nav-link" href="{{ url_for('checking') }}">✔</a>
            <a class="nav-link" href="{{ url_for('runners_page') }}">➕</a>
            <a class="nav-link" href="{{ url_for('rewards') }}">🏅</a>

        </div>

    </div>
</nav>


    <!-- MAIN CONTENT -->
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <!-- WAIVER MODAL -->
    <div class="modal fade" id="waiverModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Liability Waiver</h5></div>
          <div class="modal-body">
            <p>By participating in Leaven Run Club, you acknowledge the risks of physical activity.</p>
          </div>
          <div class="modal-footer">
            <button id="waiverAgree" class="btn btn-success">I Agree</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Waiver Logic -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        if (!localStorage.getItem("waiverSigned")) {
            new bootstrap.Modal(document.getElementById("waiverModal")).show();
        }
        document.getElementById("waiverAgree").onclick = () =>
            localStorage.setItem("waiverSigned", "true");
    });
    </script>

    <!-- Page Loaded Animation -->
    <script>
    window.addEventListener("load", () => {
        document.body.classList.add("page-loaded");
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
